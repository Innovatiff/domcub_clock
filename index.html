<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%234f46e5'/%3E%3Cg transform='translate(2.8 8.03) scale(0.726)'%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M8.6 27C7.6 15.4 15.4 5.4 26.6 5.4C33.4 5.4 37.6 9.2 39 14.3L46.3 16.9C49.5 18.1 49.9 21.3 46.7 25.5C44.9 27.9 42.7 29.6 40.5 30.4C41.9 27.6 41.7 25 40.5 23.6C38.7 21.7 36.1 21.2 33.7 22C32.1 23.8 30.7 26 29.3 28.2C27.7 30.7 26.3 33.8 25 38.6L10.6 33.2C9.2 31.2 8.7 29 8.6 27ZM28.9 13.3C31.1 12.3 33.7 13.1 34.3 15.1C33.1 16.5 30.5 16.5 28.9 15.3Z'/%3E%3C/g%3E%3C/svg%3E">
<title>Reloj — Águila</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #151a30;
    --bg2:     #1c2340;
    --primary: #4f46e5;
    --green:   #059669;
    --red:     #e11d48;
    --ease:    cubic-bezier(0.16, 1, 0.3, 1);
  }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: linear-gradient(165deg, var(--bg) 0%, var(--bg2) 100%);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body::before, body::after {
    content: ''; position: fixed; border-radius: 50%;
    pointer-events: none; filter: blur(10px);
  }
  body::before {
    top: -18vh; right: -12vw; width: 52vh; height: 52vh;
    background: radial-gradient(circle, rgba(99,102,241,0.28), transparent 70%);
    animation: flota 14s ease-in-out infinite alternate;
  }
  body::after {
    bottom: -16vh; left: -10vw; width: 44vh; height: 44vh;
    background: radial-gradient(circle, rgba(217,70,239,0.14), transparent 70%);
    animation: flota 18s ease-in-out infinite alternate-reverse;
  }
  @keyframes flota { from { transform: translate(0,0) } to { transform: translate(-5vw, 4vh) } }

  /* ── Barra superior ── */
  .top {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 14px;
    padding: 22px 30px;
    z-index: 5;
  }
  .logo {
    width: 46px; height: 46px; flex-shrink: 0;
    background: linear-gradient(135deg,#6366f1,#4f46e5);
    border-radius: 12px;
    display: grid; place-items: center;
    box-shadow: 0 6px 18px rgba(79,70,229,0.45);
  }
  .logo svg { width: 26px; height: 26px; fill: #fff; }
  .brand   { font-size: 19px; font-weight: 800; letter-spacing: -0.03em; }
  .brand-s { font-size: 11px; color: rgba(255,255,255,0.38); letter-spacing: 0.09em; text-transform: uppercase; }

  .now { margin-left: auto; text-align: right; }
  .now-time { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .now-date { font-size: 12.5px; color: rgba(255,255,255,0.42); margin-top: 4px; text-transform: capitalize; }

  /* ── Pantallas ── */
  .screen {
    width: 100%; max-width: 560px;
    padding: 34px 30px 26px;
    display: none;
    animation: rise 0.4s var(--ease) both;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 30px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 70px -30px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .screen.on { display: block; }
  @keyframes rise { from { opacity:0; transform: translateY(16px) } to { opacity:1; transform:none } }
  @keyframes pop  { 0%{transform:scale(0.85);opacity:0} 60%{transform:scale(1.04)} 100%{transform:scale(1);opacity:1} }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-9px)} 40%,80%{transform:translateX(9px)} }
  @keyframes ring { 0%,100%{box-shadow:0 0 0 0 rgba(5,150,105,0.5)} 70%{box-shadow:0 0 0 26px rgba(5,150,105,0)} }

  /* ── PIN ── */
  .saludo    { text-align: center; font-size: 14px; font-weight: 600; letter-spacing: 0.12em;
               text-transform: uppercase; color: #a5b4fc; margin-bottom: 10px; }
  .pin-title { text-align: center; font-size: 27px; font-weight: 800; letter-spacing: -0.03em; }
  .pin-sub   { text-align: center; font-size: 14.5px; color: rgba(255,255,255,0.45); margin-top: 7px; }

  .dots { display: flex; justify-content: center; gap: 16px; margin: 40px 0 34px; }
  .dot {
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.22);
    transition: all 0.2s var(--ease);
  }
  .dot.on {
    background: linear-gradient(135deg,#c7d2fe,#fff); border-color: #fff;
    transform: scale(1.18);
    box-shadow: 0 0 18px rgba(165,180,252,0.7);
    animation: pop 0.22s var(--ease);
  }
  .dots.err { animation: shake 0.42s ease; }
  .dots.err .dot { background: var(--red); border-color: var(--red); box-shadow: none; }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .key {
    height: 92px;
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.05));
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 22px;
    color: #fff;
    font-family: inherit; font-size: 32px; font-weight: 600;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 4px 14px -8px rgba(0,0,0,0.5);
    transition: transform 0.1s ease, background 0.18s ease, box-shadow 0.18s ease;
  }
  .key:active {
    transform: scale(0.93);
    background: linear-gradient(180deg, rgba(129,140,248,0.35), rgba(99,102,241,0.25));
    box-shadow: 0 0 22px rgba(99,102,241,0.35);
  }
  .key.ghost  { background: none; border-color: transparent; font-size: 24px; color: rgba(255,255,255,0.5); }
  .key.ghost:active { background: rgba(255,255,255,0.08); }

  .err-msg {
    text-align: center; min-height: 24px; margin-top: 22px;
    font-size: 15px; color: #fda4af; font-weight: 500;
  }

  /* ── Botón grande ── */
  .who { text-align: center; margin-bottom: 30px; animation: pop 0.45s var(--ease) both; }
  .who-ava {
    width: 78px; height: 78px; border-radius: 50%;
    margin: 0 auto 16px;
    display: grid; place-items: center;
    font-size: 28px; font-weight: 700;
    box-shadow: 0 8px 26px rgba(0,0,0,0.32);
  }
  .who-name { font-size: 29px; font-weight: 700; letter-spacing: -0.035em; }
  .who-sub  { font-size: 15px; color: rgba(255,255,255,0.45); margin-top: 5px; }

  .state {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 16px; padding: 9px 20px;
    border-radius: 999px;
    font-size: 14.5px; font-weight: 600;
  }
  .state.out { background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.6); }
  .state.in  { background: rgba(5,150,105,0.2); color: #6ee7b7; }
  .state .pip { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .state.in .pip { animation: ring 2s infinite; }

  /* El botón: enorme, para tablet */
  .big {
    width: 100%; height: 210px;
    border: none; border-radius: 30px;
    color: #fff;
    font-family: inherit;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    transition: transform 0.12s ease, box-shadow 0.3s var(--ease);
    animation: pop 0.5s var(--ease) 0.08s both;
  }
  .big i { font-size: 54px; line-height: 1; }
  .big .lbl { font-size: 34px; font-weight: 800; letter-spacing: -0.035em; }
  .big .hint { font-size: 15px; font-weight: 500; opacity: 0.75; }
  .big:active { transform: scale(0.975); }
  .big:disabled { opacity: 0.6; cursor: default; }

  .big.entrada {
    background: linear-gradient(160deg, #34d399, #10b981 40%, var(--green));
    box-shadow: 0 22px 50px -12px rgba(5,150,105,0.7), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .big.salida {
    background: linear-gradient(160deg, #fb7185, #f43f5e 40%, var(--red));
    box-shadow: 0 22px 50px -12px rgba(225,29,72,0.65), inset 0 1px 0 rgba(255,255,255,0.3);
  }

  .exit {
    display: block; margin: 26px auto 0;
    background: none; border: none;
    color: rgba(255,255,255,0.35);
    font-family: inherit; font-size: 15px; font-weight: 500;
    padding: 12px 26px; cursor: pointer;
  }
  .exit:active { color: #fff; }

  /* ── Confirmación ── */
  .done { text-align: center; padding: 30px 0; }
  .done-ico {
    width: 118px; height: 118px; border-radius: 50%;
    margin: 0 auto 26px;
    display: grid; place-items: center;
    font-size: 52px;
    animation: pop 0.5s var(--ease) both;
  }
  .done-ico.ok  { background: rgba(5,150,105,0.2); color: #6ee7b7;
    animation: pop 0.5s var(--ease) both, ring 1.6s var(--ease) 0.25s 2; }
  .done-ico.bye { background: rgba(225,29,72,0.18); color: #fda4af;
    animation: pop 0.5s var(--ease) both, ringBye 1.6s var(--ease) 0.25s 2; }
  @keyframes ringBye { 0%,100%{box-shadow:0 0 0 0 rgba(225,29,72,0.4)} 70%{box-shadow:0 0 0 26px rgba(225,29,72,0)} }
  .done-t { font-size: 32px; font-weight: 700; letter-spacing: -0.035em; }
  .done-s { font-size: 17px; color: rgba(255,255,255,0.5); margin-top: 10px; }
  .done-h {
    display: inline-block; margin-top: 22px;
    padding: 12px 26px; border-radius: 14px;
    background: rgba(255,255,255,0.08);
    font-size: 20px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .spin { display: inline-block; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* ── Tablet grande ── */
  @media (min-width: 820px) and (min-height: 700px) {
    .screen { max-width: 640px; }
    .key    { height: 106px; font-size: 36px; }
    .big    { height: 250px; }
    .big i  { font-size: 62px; }
    .big .lbl { font-size: 40px; }
  }

  /* ── Pantallas bajas ── */
  @media (max-height: 620px) {
    .key { height: 68px; font-size: 26px; }
    .big { height: 160px; }
    .big i { font-size: 40px; }
    .big .lbl { font-size: 28px; }
    .dots { margin: 24px 0 20px; }
    .who-ava { width: 60px; height: 60px; font-size: 22px; }
  }

  .ver { position: fixed; bottom: 8px; right: 12px; font-size: 10px;
    color: rgba(255,255,255,0.22); z-index: 5; letter-spacing: 0.06em; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="top">
  <div class="logo">
    <svg viewBox="7 0 44 44"><path fill-rule="evenodd" d="M8.6 27C7.6 15.4 15.4 5.4 26.6 5.4C33.4 5.4 37.6 9.2 39 14.3L46.3 16.9C49.5 18.1 49.9 21.3 46.7 25.5C44.9 27.9 42.7 29.6 40.5 30.4C41.9 27.6 41.7 25 40.5 23.6C38.7 21.7 36.1 21.2 33.7 22C32.1 23.8 30.7 26 29.3 28.2C27.7 30.7 26.3 33.8 25 38.6L10.6 33.2C9.2 31.2 8.7 29 8.6 27ZM28.9 13.3C31.1 12.3 33.7 13.1 34.3 15.1C33.1 16.5 30.5 16.5 28.9 15.3Z"/></svg>
  </div>
  <div>
    <div class="brand">Águila</div>
    <div class="brand-s">Reloj</div>
  </div>
  <div class="now">
    <div class="now-time" id="nowTime">--:--</div>
    <div class="now-date" id="nowDate"></div>
  </div>
</div>

<!-- 1. PIN -->
<section class="screen on" id="scPin">
  <div class="saludo" id="saludo">Bienvenido</div>
  <div class="pin-title">Ingresa tu PIN</div>
  <div class="pin-sub">Los 6 dígitos que te dio tu gerente</div>

  <div class="dots" id="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <div class="pad" id="pad"></div>
  <div class="err-msg" id="errMsg"></div>
</section>

<!-- 2. Botón -->
<section class="screen" id="scBtn">
  <div class="who">
    <div class="who-ava" id="whoAva"></div>
    <div class="who-name" id="whoName"></div>
    <div class="who-sub"  id="whoSub"></div>
    <div id="whoState"></div>
  </div>

  <button class="big entrada" id="bigBtn" onclick="marcar()">
    <i class="ico"></i>
    <span class="lbl">Marcar Entrada</span>
    <span class="hint"></span>
  </button>

  <button class="exit" onclick="reset()">Cancelar</button>
</section>

<!-- 3. Confirmación -->
<section class="screen" id="scDone">
  <div class="done">
    <div class="done-ico ok" id="doneIco">✓</div>
    <div class="done-t" id="doneT"></div>
    <div class="done-s" id="doneS"></div>
    <div class="done-h" id="doneH" style="display:none"></div>
  </div>
</section>

<div class="ver">v3</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
// La interfaz se construye ANTES de tocar la red: aunque Firebase o la
// conexión fallaran por completo, el reloj y el teclado siempre aparecen.
var db = null, auth = null;
function iniciarFirebase() {
  try {
    firebase.initializeApp({
      apiKey: "AIzaSyDtOfZXPEP-k_gvvu3Lvt307mOLBWezMrw",
      authDomain: "domcub.firebaseapp.com",
      projectId: "domcub",
      storageBucket: "domcub.firebasestorage.app",
      messagingSenderId: "329163319008",
      appId: "1:329163319008:web:1c7d3e71252ec4f5641285",
      measurementId: "G-668H2W780D"
    });
    db = firebase.firestore();
    // En un iPad instalado como app, iOS mata el canal "en vivo" de Firestore
    // cada vez que la pantalla se apaga o la app pasa a segundo plano; al
    // volver, Firestore sigue hablando con un canal muerto hasta un timeout
    // eterno — por eso "tardaba con buen wifi". El modo simple (long polling)
    // no usa ese canal y es la receta probada para kioscos en Safari/WebKit.
    db.settings({ experimentalForceLongPolling: true, merge: true });
    auth = firebase.auth();
    
    // La sesión anónima se abre al prender la pantalla, no al teclear el PIN:
    // un paso menos esperando con el dedo en el teclado. La lectura pequeña
    // de después calienta la conexión para que el primer PIN no arranque frío.
    auth.onAuthStateChanged(u => {
      if (!u) auth.signInAnonymously().catch(() => {});
      else db.collection('Config').doc('mensaje').get().catch(() => {});
    });
    
    // Al volver la app del reposo se corta y reabre la conexión a propósito:
    // mejor un reinicio limpio de un segundo que heredar un canal zombi.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      db.disableNetwork().then(() => db.enableNetwork()).catch(() => {});
    });
  } catch (e) {
    console.error('firebase', e);
    document.getElementById('errMsg').textContent = 'Sin conexión con la base. Recarga la página.';
  }
}
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const COLORS = ['#4f46e5','#0891b2','#059669','#d97706','#dc2626','#7c3aed','#0284c7','#be185d'];

const STORES = { '1':'Tienda', '2':'Tienda Cocina' };

function hora(d) {
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2,'0');
  const s = h < 12 ? 'a. m.' : 'p. m.';
  h = h % 12 || 12;
  return `${h}:${m} ${s}`;
}
function hoyStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const MCORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fechaCorta(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return isNaN(d) ? iso : `${d.getDate()} de ${MCORTO[d.getMonth()]}`;
}
function inicial(n) {
  const p = (n||'').trim().split(' ');
  return (p.length >= 2 ? p[0][0]+p[p.length-1][0] : (n||'?').slice(0,2)).toUpperCase();
}
function color(n) {
  let h = 0;
  for (const c of (n||'')) h = (h*31 + c.charCodeAt(0)) % COLORS.length;
  return COLORS[Math.abs(h) % COLORS.length];
}

// ── Reloj de pantalla ──
function tick() {
  const d = new Date();
  document.getElementById('nowTime').textContent = hora(d);
  document.getElementById('nowDate').textContent =
    `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`;
  const h = d.getHours();
  document.getElementById('saludo').textContent =
    h < 12 ? '☀️ Buenos días' : h < 18 ? '🌤️ Buenas tardes' : '🌙 Buenas noches';
}
tick(); setInterval(tick, 1000);

// ── Teclado ──
let pin = '';
const pad = document.getElementById('pad');
[1,2,3,4,5,6,7,8,9,'','0','←'].forEach(k => {
  const b = document.createElement('button');
  b.className = 'key' + (typeof k === 'string' && k !== '' ? ' ghost' : '');
  b.textContent = k;
  if (k === '') { b.style.visibility = 'hidden'; }
  b.onclick = () => k === '←' ? borrar() : teclear(String(k));
  pad.appendChild(b);
});

function pintarDots() {
  document.querySelectorAll('#dots .dot').forEach((d,i) =>
    d.classList.toggle('on', i < pin.length));
}
function teclear(n) {
  if (pin.length >= 6) return;
  document.getElementById('dots').classList.remove('err');
  document.getElementById('errMsg').textContent = '';
  pin += n; pintarDots();
  if (pin.length === 6) setTimeout(entrar, 180);
}
function borrar() { pin = pin.slice(0,-1); pintarDots(); }

function errorPin(msg) {
  const d = document.getElementById('dots');
  d.classList.add('err');
  document.getElementById('errMsg').textContent = msg;
  setTimeout(() => { pin = ''; pintarDots(); d.classList.remove('err'); }, 900);
}

function pantalla(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

// ── Sesión ──
let EMP = null, ABIERTO = null;
let intento = 0;   // un intento viejo que despierte tarde no pisa al nuevo

// Si la red se muere a mitad, mejor un aviso claro que un spinner eterno
function conTiempo(promesa, ms) {
  return Promise.race([promesa,
    new Promise((_, fail) => setTimeout(() => fail(new Error('tiempo')), ms))]);
}

async function reconectar() {
  try { await db.disableNetwork(); await db.enableNetwork(); } catch (e) {}
}

async function entrar() {
  document.getElementById('errMsg').innerHTML = '<span class="spin">◠</span> Verificando...';
  try {
    try {
      await conTiempo(entrarDeVerdad(), 8000);
    } catch (e1) {
      if (e1.message !== 'tiempo') throw e1;
      // El primer intento se colgó: casi siempre es la conexión dormida.
      // Se reinicia y se reintenta solo, sin que la persona haga nada.
      await reconectar();
      await conTiempo(entrarDeVerdad(), 10000);
    }
  } catch (err) {
    console.error(err);
    errorPin(
      err.message === 'tiempo'                  ? 'La conexión está lenta. Intenta de nuevo.' :
      err.code === 'auth/operation-not-allowed' ? 'Activa el acceso anónimo en Firebase' :
      err.code === 'permission-denied'          ? 'Tu PIN no está dado de alta. Pídele a tu gerente que abra Colaboradores y pulse "Poner al día".' :
                                                  'No se pudo conectar. Intenta de nuevo.');
  }
}

async function entrarDeVerdad() {
  const mio = ++intento;
  // Firestore exige sesión iniciada; el PIN es la credencial.
  if (!auth.currentUser) await auth.signInAnonymously();
  const uid = auth.currentUser.uid;

  // Antes esto eran seis viajes a la red, uno detrás de otro; por eso a
  // veces tardaba tanto. Ahora lo independiente va junto: el PIN, el
  // reclamo anterior y la identidad de este aparato se leen A LA VEZ.
  // Pins/{pin} sólo se puede leer conociendo el PIN exacto (no se enumera).
  const [p, claim, idx] = await Promise.all([
    db.collection('Pins').doc(pin).get(),
    db.collection('PidClaims').doc(pin).get(),
    db.collection('UserIndex').doc(uid).get()
  ]);
  if (!p.exists) { errorPin('PIN no reconocido'); return; }
  const empId = p.data().employeeId;

  // Lo normal es que la misma persona marque en la misma tablet todos los
  // días: si el reclamo y la identidad ya son los correctos, no se vuelve
  // a escribir nada — dos viajes menos, y los de escribir son los lentos.
  const claimOk = claim.exists && claim.data().uid === uid
    && claim.data().employeeId === empId;
  const idxOk = idx.exists && idx.data().pid === ('emp:' + empId)
    && idx.data().claimKey === pin;

  let empDoc, abiertos;
  if (claimOk && idxOk) {
    [empDoc, abiertos] = await Promise.all([
      db.collection('Employees').doc(empId).get(),
      db.collection('ClockIns').where('employeeId','==',empId)
        .where('clockOut','==',null).get()
    ]);
  } else {
    // Persona o aparato nuevos: hay que atar el PIN a esta sesión, y el
    // orden importa (la identidad se valida contra el reclamo). La ficha
    // del colaborador se pide en paralelo, que no depende de nada.
    const empP = db.collection('Employees').doc(empId).get();
    await db.collection('PidClaims').doc(pin).set({
      uid, employeeId: empId,
      claimedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('UserIndex').doc(uid).set({
      pid: 'emp:' + empId,
      name: (function (d) { return (d.exists && d.data().name) || ''; })(await empP),
      role: 'colaborador', claimKey: pin,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    [empDoc, abiertos] = await Promise.all([
      empP,
      db.collection('ClockIns').where('employeeId','==',empId)
        .where('clockOut','==',null).get()
    ]);
  }

  if (!empDoc.exists) { errorPin('PIN no reconocido'); return; }
  const emp = { id: empDoc.id, ...empDoc.data() };
  if (emp.status !== 'active') { errorPin('Cuenta inactiva. Habla con tu gerente.'); return; }

  if (mio !== intento) return;   // ya hay un intento más nuevo en marcha
  EMP = emp;
  document.getElementById('errMsg').textContent = '';
  mostrarBoton(abiertos);
}

function mostrarBoton(q) {
  document.getElementById('whoAva').textContent = inicial(EMP.name);
  document.getElementById('whoAva').style.background = color(EMP.name);
  document.getElementById('whoName').textContent = EMP.name;
  document.getElementById('whoSub').textContent  = STORES[EMP.store] || '';

  // El turno sin cerrar viene ya leído desde entrar() —en paralelo con la
  // ficha—. Sin filtrar por fecha a propósito: quien olvida marcar la
  // salida deja el turno abierto, y si sólo se miraran las marcas de hoy
  // no se vería, se abriría otro encima y esas horas jamás se pagarían.
  const abiertos = q.docs.map(d => ({ id:d.id, ...d.data() }))
    .sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')));
  ABIERTO = abiertos[0] || null;

  const btn = document.getElementById('bigBtn');
  const st  = document.getElementById('whoState');

  if (ABIERTO) {
    const desde  = ABIERTO.clockIn.toDate();
    const deHoy  = !ABIERTO.date || ABIERTO.date === hoyStr();
    st.innerHTML = deHoy
      ? `<span class="state in"><span class="pip"></span>Trabajando desde las ${hora(desde)}</span>`
      : `<span class="state in"><span class="pip"></span>Turno sin cerrar del ${fechaCorta(ABIERTO.date)}</span>`;
    btn.className = 'big salida';
    btn.querySelector('.ico').textContent = '■';
    btn.querySelector('.lbl').textContent = 'Marcar Salida';
    btn.querySelector('.hint').textContent = deHoy
      ? 'Toca para terminar tu turno'
      : 'Ciérralo y avisa a tu gerente para que ajuste las horas';
  } else {
    st.innerHTML = `<span class="state out"><span class="pip"></span>Sin turno abierto</span>`;
    btn.className = 'big entrada';
    btn.querySelector('.ico').textContent = '▶';
    btn.querySelector('.lbl').textContent = 'Marcar Entrada';
    btn.querySelector('.hint').textContent = 'Toca para comenzar tu turno';
  }
  btn.disabled = false;
  pantalla('scBtn');
}

async function marcar() {
  const btn = document.getElementById('bigBtn');
  btn.disabled = true;
  btn.querySelector('.lbl').textContent = 'Guardando...';
  try {
    if (ABIERTO) {
      const ahora = firebase.firestore.Timestamp.now();
      const horas = Math.round(((ahora.toDate() - ABIERTO.clockIn.toDate())/3600000)*100)/100;
      await db.collection('ClockIns').doc(ABIERTO.id).update({ clockOut: ahora, hours: horas });
      confirmar('salida', horas);
    } else {
      await db.collection('ClockIns').add({
        employeeId: EMP.id, store: EMP.store,
        clockIn: firebase.firestore.Timestamp.now(),
        clockOut: null, date: hoyStr(), hours: null
      });
      confirmar('entrada');
    }
  } catch (err) {
    console.error(err);
    btn.disabled = false;
    btn.querySelector('.lbl').textContent = ABIERTO ? 'Marcar Salida' : 'Marcar Entrada';
    alert('No se pudo guardar: ' + err.message);
  }
}

function confirmar(tipo, horas) {
  const ico = document.getElementById('doneIco');
  const nombre = (EMP.name || '').split(' ')[0];
  if (tipo === 'entrada') {
    ico.className = 'done-ico ok';  ico.textContent = '✓';
    document.getElementById('doneT').textContent = '¡Buen turno, ' + nombre + '!';
    document.getElementById('doneS').textContent = 'Entrada marcada a las ' + hora(new Date());
    document.getElementById('doneH').style.display = 'none';
  } else {
    ico.className = 'done-ico bye'; ico.textContent = '👋';
    document.getElementById('doneT').textContent = 'Hasta luego, ' + nombre;
    document.getElementById('doneS').textContent = 'Salida marcada a las ' + hora(new Date());
    const h = document.getElementById('doneH');
    h.style.display = 'inline-block';
    h.textContent = (horas || 0).toFixed(2) + ' horas trabajadas';
  }
  pantalla('scDone');
  setTimeout(reset, 4500);
}

function reset() {
  pin = ''; EMP = null; ABIERTO = null;
  pintarDots();
  document.getElementById('errMsg').textContent = '';
  pantalla('scPin');
}

// Teclado físico, por si la tablet tiene uno
document.addEventListener('keydown', e => {
  if (!document.getElementById('scPin').classList.contains('on')) return;
  if (/^[0-9]$/.test(e.key)) teclear(e.key);
  else if (e.key === 'Backspace') borrar();
});

iniciarFirebase();
</script>
