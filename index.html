<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#151a30">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%234f46e5'/%3E%3Cg transform='translate(2.8 8.03) scale(0.726)'%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M8.6 27C7.6 15.4 15.4 5.4 26.6 5.4C33.4 5.4 37.6 9.2 39 14.3L46.3 16.9C49.5 18.1 49.9 21.3 46.7 25.5C44.9 27.9 42.7 29.6 40.5 30.4C41.9 27.6 41.7 25 40.5 23.6C38.7 21.7 36.1 21.2 33.7 22C32.1 23.8 30.7 26 29.3 28.2C27.7 30.7 26.3 33.8 25 38.6L10.6 33.2C9.2 31.2 8.7 29 8.6 27ZM28.9 13.3C31.1 12.3 33.7 13.1 34.3 15.1C33.1 16.5 30.5 16.5 28.9 15.3Z'/%3E%3C/g%3E%3C/svg%3E">
<title>Reloj — El Águila</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #151a30;
    --bg2:     #1c2340;
    --primary: #4f46e5;
    --green:   #059669;
    --red:     #e11d48;
    --ease:    cubic-bezier(0.16, 1, 0.3, 1);
  }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: linear-gradient(165deg, var(--bg) 0%, var(--bg2) 100%);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body::before, body::after {
    content: ''; position: fixed; border-radius: 50%;
    pointer-events: none; filter: blur(3px);
  }
  body::before {
    top: -18vh; right: -12vw; width: 46vh; height: 46vh;
    background: radial-gradient(circle, rgba(99,102,241,0.22), transparent 70%);
  }
  body::after {
    bottom: -16vh; left: -10vw; width: 38vh; height: 38vh;
    background: radial-gradient(circle, rgba(6,182,212,0.14), transparent 70%);
  }

  /* ── Barra superior ── */
  .top {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 14px;
    padding: 22px 30px;
    z-index: 5;
  }
  .logo {
    width: 46px; height: 46px; flex-shrink: 0;
    background: linear-gradient(135deg,#6366f1,#4f46e5);
    border-radius: 12px;
    display: grid; place-items: center;
    box-shadow: 0 6px 18px rgba(79,70,229,0.45);
  }
  .logo svg { width: 26px; height: 26px; fill: #fff; }
  .brand   { font-size: 19px; font-weight: 800; letter-spacing: -0.03em; }
  .brand-s { font-size: 11px; color: rgba(255,255,255,0.38); letter-spacing: 0.09em; text-transform: uppercase; }

  .now { margin-left: auto; text-align: right; }
  .now-time { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .now-date { font-size: 12.5px; color: rgba(255,255,255,0.42); margin-top: 4px; text-transform: capitalize; }

  /* ── Pantallas ── */
  .screen {
    width: 100%; max-width: 560px;
    padding: 24px;
    display: none;
    animation: rise 0.4s var(--ease) both;
  }
  .screen.on { display: block; }
  @keyframes rise { from { opacity:0; transform: translateY(16px) } to { opacity:1; transform:none } }
  @keyframes pop  { 0%{transform:scale(0.85);opacity:0} 60%{transform:scale(1.04)} 100%{transform:scale(1);opacity:1} }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-9px)} 40%,80%{transform:translateX(9px)} }
  @keyframes ring { 0%,100%{box-shadow:0 0 0 0 rgba(5,150,105,0.5)} 70%{box-shadow:0 0 0 26px rgba(5,150,105,0)} }

  /* ── PIN ── */
  .pin-title { text-align: center; font-size: 25px; font-weight: 700; letter-spacing: -0.03em; }
  .pin-sub   { text-align: center; font-size: 15px; color: rgba(255,255,255,0.45); margin-top: 8px; }

  .dots { display: flex; justify-content: center; gap: 16px; margin: 40px 0 34px; }
  .dot {
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.22);
    transition: all 0.2s var(--ease);
  }
  .dot.on {
    background: #fff; border-color: #fff;
    transform: scale(1.18);
    box-shadow: 0 0 16px rgba(255,255,255,0.55);
  }
  .dots.err { animation: shake 0.42s ease; }
  .dots.err .dot { background: var(--red); border-color: var(--red); box-shadow: none; }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .key {
    height: 92px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    color: #fff;
    font-family: inherit; font-size: 32px; font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.18s ease;
  }
  .key:active { transform: scale(0.94); background: rgba(255,255,255,0.18); }
  .key.ghost  { background: none; border-color: transparent; font-size: 24px; color: rgba(255,255,255,0.5); }
  .key.ghost:active { background: rgba(255,255,255,0.08); }

  .err-msg {
    text-align: center; min-height: 24px; margin-top: 22px;
    font-size: 15px; color: #fda4af; font-weight: 500;
  }

  /* ── Botón grande ── */
  .who { text-align: center; margin-bottom: 30px; animation: pop 0.45s var(--ease) both; }
  .who-ava {
    width: 78px; height: 78px; border-radius: 50%;
    margin: 0 auto 16px;
    display: grid; place-items: center;
    font-size: 28px; font-weight: 700;
    box-shadow: 0 8px 26px rgba(0,0,0,0.32);
  }
  .who-name { font-size: 29px; font-weight: 700; letter-spacing: -0.035em; }
  .who-sub  { font-size: 15px; color: rgba(255,255,255,0.45); margin-top: 5px; }

  .state {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 16px; padding: 9px 20px;
    border-radius: 999px;
    font-size: 14.5px; font-weight: 600;
  }
  .state.out { background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.6); }
  .state.in  { background: rgba(5,150,105,0.2); color: #6ee7b7; }
  .state .pip { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .state.in .pip { animation: ring 2s infinite; }

  /* El botón: enorme, para tablet */
  .big {
    width: 100%; height: 210px;
    border: none; border-radius: 30px;
    color: #fff;
    font-family: inherit;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    transition: transform 0.12s ease, box-shadow 0.3s var(--ease);
    animation: pop 0.5s var(--ease) 0.08s both;
  }
  .big i { font-size: 54px; line-height: 1; }
  .big .lbl { font-size: 34px; font-weight: 800; letter-spacing: -0.035em; }
  .big .hint { font-size: 15px; font-weight: 500; opacity: 0.75; }
  .big:active { transform: scale(0.975); }
  .big:disabled { opacity: 0.6; cursor: default; }

  .big.entrada {
    background: linear-gradient(160deg, #10b981, var(--green));
    box-shadow: 0 18px 44px -12px rgba(5,150,105,0.65);
  }
  .big.salida {
    background: linear-gradient(160deg, #f43f5e, var(--red));
    box-shadow: 0 18px 44px -12px rgba(225,29,72,0.6);
  }

  .exit {
    display: block; margin: 26px auto 0;
    background: none; border: none;
    color: rgba(255,255,255,0.35);
    font-family: inherit; font-size: 15px; font-weight: 500;
    padding: 12px 26px; cursor: pointer;
  }
  .exit:active { color: #fff; }

  /* ── Confirmación ── */
  .done { text-align: center; padding: 30px 0; }
  .done-ico {
    width: 118px; height: 118px; border-radius: 50%;
    margin: 0 auto 26px;
    display: grid; place-items: center;
    font-size: 52px;
    animation: pop 0.5s var(--ease) both;
  }
  .done-ico.ok  { background: rgba(5,150,105,0.2); color: #6ee7b7; }
  .done-ico.bye { background: rgba(225,29,72,0.18); color: #fda4af; }
  .done-t { font-size: 32px; font-weight: 700; letter-spacing: -0.035em; }
  .done-s { font-size: 17px; color: rgba(255,255,255,0.5); margin-top: 10px; }
  .done-h {
    display: inline-block; margin-top: 22px;
    padding: 12px 26px; border-radius: 14px;
    background: rgba(255,255,255,0.08);
    font-size: 20px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .spin { display: inline-block; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* ── Tablet grande ── */
  @media (min-width: 820px) and (min-height: 700px) {
    .screen { max-width: 640px; }
    .key    { height: 106px; font-size: 36px; }
    .big    { height: 250px; }
    .big i  { font-size: 62px; }
    .big .lbl { font-size: 40px; }
  }

  /* ── Pantallas bajas ── */
  @media (max-height: 620px) {
    .key { height: 68px; font-size: 26px; }
    .big { height: 160px; }
    .big i { font-size: 40px; }
    .big .lbl { font-size: 28px; }
    .dots { margin: 24px 0 20px; }
    .who-ava { width: 60px; height: 60px; font-size: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="top">
  <div class="logo">
    <svg viewBox="7 0 44 44"><path fill-rule="evenodd" d="M8.6 27C7.6 15.4 15.4 5.4 26.6 5.4C33.4 5.4 37.6 9.2 39 14.3L46.3 16.9C49.5 18.1 49.9 21.3 46.7 25.5C44.9 27.9 42.7 29.6 40.5 30.4C41.9 27.6 41.7 25 40.5 23.6C38.7 21.7 36.1 21.2 33.7 22C32.1 23.8 30.7 26 29.3 28.2C27.7 30.7 26.3 33.8 25 38.6L10.6 33.2C9.2 31.2 8.7 29 8.6 27ZM28.9 13.3C31.1 12.3 33.7 13.1 34.3 15.1C33.1 16.5 30.5 16.5 28.9 15.3Z"/></svg>
  </div>
  <div>
    <div class="brand">El Águila</div>
    <div class="brand-s">Reloj</div>
  </div>
  <div class="now">
    <div class="now-time" id="nowTime">--:--</div>
    <div class="now-date" id="nowDate"></div>
  </div>
</div>

<!-- 1. PIN -->
<section class="screen on" id="scPin">
  <div class="pin-title">Ingresa tu PIN</div>
  <div class="pin-sub">Los 6 dígitos que te dio tu gerente</div>

  <div class="dots" id="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <div class="pad" id="pad"></div>
  <div class="err-msg" id="errMsg"></div>
</section>

<!-- 2. Botón -->
<section class="screen" id="scBtn">
  <div class="who">
    <div class="who-ava" id="whoAva"></div>
    <div class="who-name" id="whoName"></div>
    <div class="who-sub"  id="whoSub"></div>
    <div id="whoState"></div>
  </div>

  <button class="big entrada" id="bigBtn" onclick="marcar()">
    <i class="ico"></i>
    <span class="lbl">Marcar Entrada</span>
    <span class="hint"></span>
  </button>

  <button class="exit" onclick="reset()">Cancelar</button>
</section>

<!-- 3. Confirmación -->
<section class="screen" id="scDone">
  <div class="done">
    <div class="done-ico ok" id="doneIco">✓</div>
    <div class="done-t" id="doneT"></div>
    <div class="done-s" id="doneS"></div>
    <div class="done-h" id="doneH" style="display:none"></div>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyDtOfZXPEP-k_gvvu3Lvt307mOLBWezMrw",
  authDomain: "domcub.firebaseapp.com",
  projectId: "domcub",
  storageBucket: "domcub.firebasestorage.app",
  messagingSenderId: "329163319008",
  appId: "1:329163319008:web:1c7d3e71252ec4f5641285",
  measurementId: "G-668H2W780D"
});
const db = firebase.firestore();
const auth = firebase.auth();

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const COLORS = ['#4f46e5','#0891b2','#059669','#d97706','#dc2626','#7c3aed','#0284c7','#be185d'];

const STORES = { '1':'Tienda Despensas', '2':'Tienda Cocina' };

function hora(d) {
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2,'0');
  const s = h < 12 ? 'a. m.' : 'p. m.';
  h = h % 12 || 12;
  return `${h}:${m} ${s}`;
}
function hoyStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function inicial(n) {
  const p = (n||'').trim().split(' ');
  return (p.length >= 2 ? p[0][0]+p[p.length-1][0] : (n||'?').slice(0,2)).toUpperCase();
}
function color(n) {
  let h = 0;
  for (const c of (n||'')) h = (h*31 + c.charCodeAt(0)) % COLORS.length;
  return COLORS[Math.abs(h) % COLORS.length];
}

// ── Reloj de pantalla ──
function tick() {
  const d = new Date();
  document.getElementById('nowTime').textContent = hora(d);
  document.getElementById('nowDate').textContent =
    `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`;
}
tick(); setInterval(tick, 1000);

// ── Teclado ──
let pin = '';
const pad = document.getElementById('pad');
[1,2,3,4,5,6,7,8,9,'','0','←'].forEach(k => {
  const b = document.createElement('button');
  b.className = 'key' + (typeof k === 'string' && k !== '' ? ' ghost' : '');
  b.textContent = k;
  if (k === '') { b.style.visibility = 'hidden'; }
  b.onclick = () => k === '←' ? borrar() : teclear(String(k));
  pad.appendChild(b);
});

function pintarDots() {
  document.querySelectorAll('#dots .dot').forEach((d,i) =>
    d.classList.toggle('on', i < pin.length));
}
function teclear(n) {
  if (pin.length >= 6) return;
  document.getElementById('dots').classList.remove('err');
  document.getElementById('errMsg').textContent = '';
  pin += n; pintarDots();
  if (pin.length === 6) setTimeout(entrar, 180);
}
function borrar() { pin = pin.slice(0,-1); pintarDots(); }

function errorPin(msg) {
  const d = document.getElementById('dots');
  d.classList.add('err');
  document.getElementById('errMsg').textContent = msg;
  setTimeout(() => { pin = ''; pintarDots(); d.classList.remove('err'); }, 900);
}

function pantalla(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

// ── Sesión ──
let EMP = null, ABIERTO = null;

async function entrar() {
  document.getElementById('errMsg').innerHTML = '<span class="spin">◠</span> Verificando...';
  try {
    // Firestore exige sesión iniciada; el PIN es la credencial.
    if (!auth.currentUser) await auth.signInAnonymously();

    // Pins/{pin} sólo se puede leer si ya se conoce el PIN exacto:
    // la colección no permite enumerar.
    const p = await db.collection('Pins').doc(pin).get();
    if (!p.exists) { errorPin('PIN no reconocido'); return; }

    const empDoc = await db.collection('Employees').doc(p.data().employeeId).get();
    if (!empDoc.exists) { errorPin('PIN no reconocido'); return; }

    const emp = { id: empDoc.id, ...empDoc.data() };
    if (emp.status !== 'active') { errorPin('Cuenta inactiva. Habla con tu gerente.'); return; }

    // Ata este dispositivo al PIN para que las reglas puedan verificar
    // que el registro de horas es de esta persona.
    await db.collection('PidClaims').doc(pin).set({
      uid: auth.currentUser.uid,
      employeeId: emp.id,
      claimedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('UserIndex').doc(auth.currentUser.uid).set({
      pid: 'emp:' + emp.id, name: emp.name, role: 'colaborador', claimKey: pin,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    EMP = emp;
    document.getElementById('errMsg').textContent = '';
    await mostrarBoton();
  } catch (err) {
    console.error(err);
    errorPin(err.code === 'auth/operation-not-allowed'
      ? 'Activa el acceso anónimo en Firebase'
      : 'No se pudo conectar. Intenta de nuevo.');
  }
}

async function mostrarBoton() {
  document.getElementById('whoAva').textContent = inicial(EMP.name);
  document.getElementById('whoAva').style.background = color(EMP.name);
  document.getElementById('whoName').textContent = EMP.name;
  document.getElementById('whoSub').textContent  = STORES[EMP.store] || '';

  // ¿Tiene un turno abierto hoy?
  const q = await db.collection('ClockIns')
    .where('employeeId','==',EMP.id)
    .where('date','==',hoyStr())
    .where('clockOut','==',null)
    .limit(1).get();
  ABIERTO = q.empty ? null : { id:q.docs[0].id, ...q.docs[0].data() };

  const btn = document.getElementById('bigBtn');
  const st  = document.getElementById('whoState');

  if (ABIERTO) {
    const desde = ABIERTO.clockIn.toDate();
    st.innerHTML = `<span class="state in"><span class="pip"></span>Trabajando desde las ${hora(desde)}</span>`;
    btn.className = 'big salida';
    btn.querySelector('.ico').textContent = '■';
    btn.querySelector('.lbl').textContent = 'Marcar Salida';
    btn.querySelector('.hint').textContent = 'Toca para terminar tu turno';
  } else {
    st.innerHTML = `<span class="state out"><span class="pip"></span>Sin turno abierto</span>`;
    btn.className = 'big entrada';
    btn.querySelector('.ico').textContent = '▶';
    btn.querySelector('.lbl').textContent = 'Marcar Entrada';
    btn.querySelector('.hint').textContent = 'Toca para comenzar tu turno';
  }
  btn.disabled = false;
  pantalla('scBtn');
}

async function marcar() {
  const btn = document.getElementById('bigBtn');
  btn.disabled = true;
  btn.querySelector('.lbl').textContent = 'Guardando...';
  try {
    if (ABIERTO) {
      const ahora = firebase.firestore.Timestamp.now();
      const horas = Math.round(((ahora.toDate() - ABIERTO.clockIn.toDate())/3600000)*100)/100;
      await db.collection('ClockIns').doc(ABIERTO.id).update({ clockOut: ahora, hours: horas });
      confirmar('salida', horas);
    } else {
      await db.collection('ClockIns').add({
        employeeId: EMP.id, store: EMP.store,
        clockIn: firebase.firestore.Timestamp.now(),
        clockOut: null, date: hoyStr(), hours: null
      });
      confirmar('entrada');
    }
  } catch (err) {
    console.error(err);
    btn.disabled = false;
    btn.querySelector('.lbl').textContent = ABIERTO ? 'Marcar Salida' : 'Marcar Entrada';
    alert('No se pudo guardar: ' + err.message);
  }
}

function confirmar(tipo, horas) {
  const ico = document.getElementById('doneIco');
  const nombre = (EMP.name || '').split(' ')[0];
  if (tipo === 'entrada') {
    ico.className = 'done-ico ok';  ico.textContent = '✓';
    document.getElementById('doneT').textContent = '¡Buen turno, ' + nombre + '!';
    document.getElementById('doneS').textContent = 'Entrada marcada a las ' + hora(new Date());
    document.getElementById('doneH').style.display = 'none';
  } else {
    ico.className = 'done-ico bye'; ico.textContent = '👋';
    document.getElementById('doneT').textContent = 'Hasta luego, ' + nombre;
    document.getElementById('doneS').textContent = 'Salida marcada a las ' + hora(new Date());
    const h = document.getElementById('doneH');
    h.style.display = 'inline-block';
    h.textContent = (horas || 0).toFixed(2) + ' horas trabajadas';
  }
  pantalla('scDone');
  setTimeout(reset, 4500);
}

function reset() {
  pin = ''; EMP = null; ABIERTO = null;
  pintarDots();
  document.getElementById('errMsg').textContent = '';
  pantalla('scPin');
}

// Teclado físico, por si la tablet tiene uno
document.addEventListener('keydown', e => {
  if (!document.getElementById('scPin').classList.contains('on')) return;
  if (/^[0-9]$/.test(e.key)) teclear(e.key);
  else if (e.key === 'Backspace') borrar();
});
</script>
</body>
</html>
